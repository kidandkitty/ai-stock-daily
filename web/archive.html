<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>歷史日報 — AI 美股日報</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0f1e;--bg2:#0f172a;--bg3:#1e293b;--text:#e2e8f0;--text2:#94a3b8;--text3:#475569;--accent:#3b82f6;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--border:#1e293b;--radius:10px}
body{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:0;z-index:100}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.nav-logo-text{font-size:15px;font-weight:700;color:#f1f5f9}
.nav-links{display:flex;gap:4px}
.nav-link{padding:6px 14px;border-radius:6px;font-size:13px;color:var(--text2);transition:all 0.15s}
.nav-link:hover{background:var(--bg3);color:var(--text)}
.nav-link.active{background:var(--accent)22;color:var(--accent)}
.nav-cta{background:var(--accent);color:#fff;padding:7px 16px;border-radius:6px;font-size:13px;font-weight:600}
.main{max-width:1100px;margin:0 auto;padding:40px 24px}
.page-title{font-size:28px;font-weight:800;color:#f1f5f9;margin-bottom:8px}
.page-sub{font-size:14px;color:var(--text2);margin-bottom:32px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.filter-btn{padding:6px 16px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all 0.15s}
.filter-btn:hover,.filter-btn.active{background:var(--accent)22;color:var(--accent);border-color:var(--accent)55}
.archive-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.archive-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;transition:all 0.15s;cursor:pointer;display:block}
.archive-card:hover{border-color:var(--accent)55;transform:translateY(-2px)}
.archive-date{font-size:11px;color:var(--text3);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.archive-mode{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--bg3);color:var(--text3)}
.archive-headline{font-size:14px;font-weight:600;color:#f1f5f9;line-height:1.5;margin-bottom:12px}
.archive-meta{display:flex;align-items:center;gap:8px}
.archive-mood{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.archive-arrow{margin-left:auto;color:var(--accent);font-size:12px;font-weight:600}
.empty{text-align:center;padding:48px;color:var(--text3);font-size:14px}

footer{background:var(--bg2);border-top:1px solid var(--border);padding:24px;text-align:center;margin-top:48px}
.footer-disclaimer{font-size:11px;color:var(--text3);line-height:1.6}
@media(max-width:768px){.nav-links,.nav-cta{display:none}.archive-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-icon">📈</div>
      <div><div class="nav-logo-text">AI 美股日報</div></div>
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">首頁</a>
      <a href="latest.html" class="nav-link">今日日報</a>
      <a href="archive.html" class="nav-link active">歷史記錄</a>
    </div>
    <a href="latest.html" class="nav-cta">今日日報 →</a>
  </div>
</nav>

<div class="main">
  <div class="page-title">📋 歷史日報記錄</div>
  <div class="page-sub">所有過往日報存檔，點擊查看完整分析內容</div>

  <div class="filter-row">
    <button class="filter-btn active" onclick="filterArchive('all',this)">全部</button>
    <button class="filter-btn" onclick="filterArchive('weekday',this)">📈 每日版</button>
    <button class="filter-btn" onclick="filterArchive('friday',this)">📅 週五版</button>
    <button class="filter-btn" onclick="filterArchive('saturday',this)">🗓 週六版</button>
    <button class="filter-btn" onclick="filterArchive('sunday',this)">🗓 週日版</button>
    <button class="filter-btn" onclick="filterArchive('多頭',this)">🟢 多頭日</button>
    <button class="filter-btn" onclick="filterArchive('空頭',this)">🔴 空頭日</button>
  </div>

  

  <div class="archive-grid" id="archive-grid">
    <div class="empty">載入中...</div>
  </div>
</div>

<footer>
  <div class="footer-disclaimer">
    ⚠️ 本網站所有內容僅供參考，不構成任何投資建議。<br>
    投資有風險，期權交易可能導致本金全部損失，請謹慎評估自身風險承受能力。
  </div>
</footer>

<script>
let allData = [];
const moodColors = {'多頭':'#22c55e','空頭':'#ef4444','震盪':'#f59e0b'};
const modeLabels = {'friday':'📅 週五版','saturday':'🗓 週六版','sunday':'🗓 週日版','weekday':'📈 每日版'};

async function loadArchive() {
  try {
    const res = await fetch('index.json');
    if (!res.ok) throw new Error('無法載入');
    allData = await res.json();
    renderArchive(allData);
  } catch(e) {
    document.getElementById('archive-grid').innerHTML = '<div class="empty">暫無歷史記錄</div>';
  }
}

function renderArchive(data) {
  const grid = document.getElementById('archive-grid');
  if (!data.length) {
    grid.innerHTML = '<div class="empty">沒有符合條件的日報</div>';
    return;
  }
  grid.innerHTML = data.map(item => {
    const mc = moodColors[item.mood] || '#f59e0b';
    const ml = modeLabels[item.mode] || '📈 每日版';
    return `
    <a href="reports/${item.date}.html" class="archive-card">
      <div class="archive-date">
        ${item.date}
        <span class="archive-mode">${ml}</span>
      </div>
      <div class="archive-headline">${item.headline || '—'}</div>
      <div class="archive-meta">
        <span class="archive-mood" style="background:${mc}22;color:${mc}">${item.mood || '—'}</span>
        <span class="archive-arrow">查看完整日報 →</span>
      </div>
    </a>`;
  }).join('');
}

function filterArchive(filter, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (filter === 'all') {
    renderArchive(allData);
  } else if (['多頭','空頭','震盪'].includes(filter)) {
    renderArchive(allData.filter(d => d.mood === filter));
  } else {
    renderArchive(allData.filter(d => (d.mode || 'weekday') === filter));
  }
}

loadArchive();
</script>
</body>
</html>
